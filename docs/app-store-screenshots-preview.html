<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GrowingUp — скриншоты App Store</title>
<style>
  :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#080e1b;color:#f8fafc}
  body{max-width:1600px;margin:auto;padding:32px 24px}
  h1{font-size:clamp(24px,3vw,36px);margin:0 0 8px}
  p{color:#a7b1c4;margin:0 0 24px}
  nav{display:flex;gap:8px;margin-bottom:24px}
  button{font:inherit;color:inherit;background:#172237;border:1px solid #35435e;border-radius:10px;padding:10px 18px;cursor:pointer}
  button[aria-pressed=true]{background:#3461e5;border-color:#7997ff}
  main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
  figure{margin:0}
  a{color:inherit;text-decoration:none}
  img{width:100%;height:auto;display:block;border:1px solid #283247;border-radius:12px;box-sizing:border-box}
  figcaption{color:#a7b1c4;font-size:14px;margin-top:12px}
  @media(max-width:900px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:480px){body{padding:24px 16px}main{grid-template-columns:1fr}}
</style>
<h1>GrowingUp · App Store</h1>
<p>Реальные кадры приложения и виджетов · iOS 26.5 · 1320 × 2868</p>
<nav aria-label="Язык скриншотов">
  <button data-locale="ru" aria-pressed="true">Русский</button>
  <button data-locale="en-US" aria-pressed="false">English</button>
</nav>
<main>
  <figure><a href="../marketing/app-store/screenshots/ru/01-mia.png"><img src="../marketing/app-store/screenshots/ru/01-mia.png" alt="Мия — возраст ребёнка"></a><figcaption>01 · Мия</figcaption></figure>
  <figure><a href="../marketing/app-store/screenshots/ru/02-leo-celebration.png"><img src="../marketing/app-store/screenshots/ru/02-leo-celebration.png" alt="Лео — поздравление с конфетти"></a><figcaption>02 · Лео</figcaption></figure>
  <figure><a href="../marketing/app-store/screenshots/ru/03-mango-teddy.png"><img src="../marketing/app-store/screenshots/ru/03-mango-teddy.png" alt="Манго и Тедди — возраст питомцев"></a><figcaption>03 · Манго и Тедди</figcaption></figure>
  <figure><a href="../marketing/app-store/screenshots/ru/04-widgets.png"><img src="../marketing/app-store/screenshots/ru/04-widgets.png" alt="Три размера виджетов"></a><figcaption>04 · Виджеты</figcaption></figure>
</main>
<script>
  document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{
    document.querySelectorAll('button').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
    document.querySelectorAll('main a').forEach(link=>{
      const file=link.getAttribute('href').split('/').pop();
      const path=`../marketing/app-store/screenshots/${button.dataset.locale}/${file}`;
      link.href=path;
      link.querySelector('img').src=path;
    });
  }));
</script>
</html>
