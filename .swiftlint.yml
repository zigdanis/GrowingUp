disabled_rules:
  - vertical_parameter_alignment
  # swift-format intentionally places the opening brace for some multiline
  # declarations on its own line. Let the formatter own that whitespace.
  - opening_brace
opt_in_rules:
  - attributes
  - closure_end_indentation
  - closure_spacing
  - contains_over_first_not_nil
  - convenience_type
  - empty_count
  - empty_string
  - empty_xctest_method
  - fatal_error_message
  - file_name
excluded:
  - Carthage
  # build/ is gitignored derived output (incl. SwiftPM dependency checkouts),
  # not project source — the lint build phase must not scan it.
  - build
  # Local Codex agent/plugin assets can include Swift templates that are not
  # app source and should not participate in project lint gates.
  - .agents
  - .codex
  - plugins
line_length: 160
file_length: 450
type_name: 
  max_length: 45
identifier_name:
  excluded:
    - id
