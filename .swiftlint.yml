disabled_rules:
  - vertical_parameter_alignment
opt_in_rules:
  - attributes
  - closure_end_indentation
  - closure_spacing
  - contains_over_first_not_nil
  - convenience_type
  - empty_count
  - empty_string
  - empty_xctest_method
  - fatal_error_message
  - file_name
excluded:
  - Carthage
  # build/ is gitignored derived output (incl. SwiftPM dependency checkouts),
  # not project source — the lint build phase must not scan it.
  - build
line_length: 300
type_name: 
  max_length: 45
identifier_name:
  excluded:
    - id