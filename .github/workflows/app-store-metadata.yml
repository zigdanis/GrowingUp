name: App Store Metadata
run-name: App Store screenshots — ${{ inputs.operation }} — ${{ inputs.groups || 'all sets' }}

# Screenshots are never captured on CI. They are shot on MacPro (see .agents/skills/app-store-screenshots),
# committed with their native captures and listed in marketing/app-store/screenshots/families.json.
# This workflow only inspects App Store Connect or places those committed sets on the manifest's draft version.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect Apple inventory, validate the committed sets against Apple, or place them on the draft (never submit)
        type: choice
        options: [inventory, validate, upload]
        default: inventory
        required: true
      source_sha:
        description: Reviewed full master commit SHA with successful CI and committed screenshots
        type: string
        required: true
      groups:
        description: Optional space-separated families.json groups (e.g. IPAD_13_PROFILE); empty means every set
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: growingup-app-store-metadata
  cancel-in-progress: false

jobs:
  metadata:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: testflight
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      OPERATION: ${{ inputs.operation }}
      SCREENSHOT_GROUPS: ${{ inputs.groups }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed master source and green CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha must be a full commit SHA'; exit 1; }
          git merge-base --is-ancestor "$SOURCE_SHA" origin/master
          CI=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch master --event push --commit "$SOURCE_SHA" --limit 1 --json status,conclusion)
          jq -e '.[0].status == "completed" and .[0].conclusion == "success"' <<< "$CI" >/dev/null
          case "$OPERATION" in inventory|validate|upload) ;; *) exit 1 ;; esac
          [[ "$SCREENSHOT_GROUPS" =~ ^[A-Z0-9_\ ]*$ ]] || { echo 'groups must be space-separated placement group IDs'; exit 1; }
          METADATA_DIRECTORY=$(mktemp -d "$RUNNER_TEMP/app-store-metadata.XXXXXX")
          chmod 700 "$METADATA_DIRECTORY"
          echo "METADATA_TEMP=$METADATA_DIRECTORY" >> "$GITHUB_ENV"
          git worktree add --detach "$METADATA_DIRECTORY/source" "$SOURCE_SHA"
          test -f "$METADATA_DIRECTORY/source/scripts/app-store-families.py"
      - name: Install isolated API signing dependency
        run: |
          python3 -m venv "$METADATA_TEMP/venv"
          "$METADATA_TEMP/venv/bin/pip" install 'PyJWT==2.10.1' 'cryptography==46.0.3'
      - name: Inspect, validate or place the MacPro-captured screenshot sets
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          for name in ('ASC_PRIVATE_KEY', 'ASC_KEY_ID', 'ASC_ISSUER_ID'):
              if not os.environ.get(name, '').strip():
                  raise SystemExit('Missing environment secret: ' + name)
          path = Path(os.environ['METADATA_TEMP']) / 'AuthKey.p8'
          path.write_text(os.environ['ASC_PRIVATE_KEY'] + '\n')
          path.chmod(0o600)
          PY
          export ASC_KEY_PATH="$METADATA_TEMP/AuthKey.p8"
          unset ASC_PRIVATE_KEY
          SOURCE="$METADATA_TEMP/source"
          if [ "$OPERATION" = inventory ]; then
            "$METADATA_TEMP/venv/bin/python" "$SOURCE/scripts/app-store-metadata.py" inventory \
              --source-sha "$SOURCE_SHA" --receipt "$METADATA_TEMP/receipt.json"
          else
            ARGS=()
            test "$OPERATION" != upload || ARGS+=(--upload)
            for GROUP in $SCREENSHOT_GROUPS; do ARGS+=(--group "$GROUP"); done
            "$METADATA_TEMP/venv/bin/python" "$SOURCE/scripts/app-store-families.py" \
              "$SOURCE/marketing/app-store/screenshots/families.json" "${ARGS[@]}" \
              --receipt "$METADATA_TEMP/receipt.json"
          fi
      - name: Retain nonsecret Apple inventory or verified screenshot receipt
        if: always() && env.METADATA_TEMP != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-store-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.METADATA_TEMP }}/receipt.json
          if-no-files-found: warn
          retention-days: 90
      - name: Remove credentials and temporary source
        if: always() && env.METADATA_TEMP != ''
        run: |
          rm -rf "$METADATA_TEMP"
          git worktree prune
