name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-tools:
    name: Release Tools
    runs-on: macos-26
    env:
      MATCH_GIT_URL: git@github.com:zigdanis/zigdanis-certificates.git
      FASTLANE_SKIP_UPDATE_CHECK: 'true'
      FASTLANE_SKIP_DOCS: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Check release state and fastlane configuration
        env:
          FL_REPORT_PATH: ${{ runner.temp }}
        run: |
          MT_NO_PLUGINS=1 ruby fastlane/tests/test_testflight_release.rb
          bundle exec ruby fastlane/tests/test_release_signing.rb
          bundle exec ruby fastlane/tests/test_release_archive.rb
          bundle exec ruby fastlane/tests/test_release_distribution.rb
          bundle exec ruby fastlane/tests/test_release_execution.rb
          bundle exec fastlane lanes
          bundle exec fastlane action match | ruby -e 'abort "Pinned match lacks safe expired-certificate renewal" unless STDIN.read.include?("renew_expired_certs")'

  evidence-tools:
    name: Evidence Tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Check evidence scripts
        run: |
          bash -n scripts/run-ui-journeys.sh
          bash -n scripts/pr-evidence.sh
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests

  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      ios_required: ${{ steps.filter.outputs.ios_required }}
      ui_required: ${{ steps.filter.outputs.ui_required }}
      ui_matrix: ${{ steps.ui.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci-scope.py --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      # PRs get the Glass journeys and screenshots on the image that ships iOS 26.5, plus
      # the iPhone Duo pass on the shipping toolchain (Xcode 27.1), whose downloaded iOS 27.1
      # runtime only offers that device. The Duo simulator boots
      # folded, so its journeys run on the outer display ("primary"); simctl needs that
      # display named for video. The iOS 27 and slower, flakier iOS 18 passes run on master
      # pushes and manual runs only.
      - name: Choose UI devices
        id: ui
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          MATRIX=$(jq -c --arg event "$EVENT_NAME" \
            '[.[] | select($event != "pull_request" or .on_pull_request) | del(.on_pull_request)]' <<'JSON'
          [
            {"name": "Glass", "runner": "macos-26", "xcode": "26.6", "runtime": "26-5",
             "device": "iPhone-17-Pro", "on_pull_request": true},
            {"name": "iPhone Duo", "runner": "xcode-27", "xcode": "27.1", "runtime": "27-1",
             "device": "iPhone-Duo", "display": "primary", "on_pull_request": true},
            {"name": "iOS 27", "runner": "xcode-27", "xcode": "27.1", "runtime": "27-0",
             "device": "iPhone-18-Pro", "on_pull_request": false},
            {"name": "iOS 18", "runner": "macos-15", "xcode": "26.3", "runtime": "18-5",
             "device": "iPhone-16", "on_pull_request": false}
          ]
          JSON
          )
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  secrets:
    name: Secret Patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tracked files
        run: scripts/check-secrets.sh

  formatting:
    name: Swift Format
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ios_required != 'false' }}
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_27.1.app

      - name: Check formatting
        run: |
          xcodebuild -version
          xcrun swift-format --version
          scripts/check-formatting.sh

  lint:
    name: SwiftLint
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ios_required != 'false' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Install SwiftLint
        run: |
          command -v swiftlint >/dev/null 2>&1 || brew install swiftlint
          swiftlint version

      - name: Run SwiftLint
        run: scripts/lint-swift.sh

  build-test:
    name: Build & Test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ios_required != 'false' }}
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_27.1.app

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project GrowingUp.xcodeproj \
            -scheme GrowingUp

      - name: Pick iOS Simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.isAvailable and (.name | startswith("iPhone")))] | .[0] // empty')
          test -n "$DEVICE" || { echo "No available iPhone simulator on runner"; exit 1; }
          UDID=$(jq -r '.udid' <<< "$DEVICE")
          echo "Using $(jq -r '.name' <<< "$DEVICE") ($UDID)"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build & Test
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          xcodebuild test \
            -project GrowingUp.xcodeproj \
            -scheme GrowingUp \
            -only-testing:GrowingUpTests \
            -destination "id=$SIM_UDID"

  ui-tests:
    name: UI Tests — ${{ matrix.name }}
    # Starts beside Build & Test so screenshots arrive about ten minutes sooner.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ui_required == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.ui_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - name: Prepare evidence directory
        id: evidence
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEVICE: ${{ matrix.device }}
          RUNTIME: ${{ matrix.runtime }}
          XCODE: ${{ matrix.xcode }}
        run: |
          ARTIFACT_DIR=$(mktemp -d "$RUNNER_TEMP/ui-evidence.XXXXXX")
          echo "directory=$ARTIFACT_DIR" >> "$GITHUB_OUTPUT"
          jq -n --arg head "$HEAD_SHA" --arg checkout "$(git rev-parse HEAD)" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg device "$DEVICE" --arg runtime "$RUNTIME" --arg xcode "$XCODE" \
            '{head_sha: $head, checkout_sha: $checkout, run_id: $run, run_attempt: $attempt,
              device: $device, runtime: $runtime, xcode: $xcode}' \
            > "$ARTIFACT_DIR/metadata.json"
      - name: Select pinned Xcode
        run: |
          test -d "/Applications/Xcode_${{ matrix.xcode }}.app"
          sudo xcode-select -switch "/Applications/Xcode_${{ matrix.xcode }}.app"
          xcodebuild -version
      - name: Prepare simulator
        id: simulator
        run: |
          RUNTIME="com.apple.CoreSimulator.SimRuntime.iOS-${{ matrix.runtime }}"
          DEVICE_TYPE="com.apple.CoreSimulator.SimDeviceType.${{ matrix.device }}"
          if ! xcrun simctl list runtimes available --json \
            | jq -e --arg runtime "$RUNTIME" '.runtimes[] | select(.identifier == $runtime)' > /dev/null; then
            VERSION="${{ matrix.runtime }}"
            for ATTEMPT in 1 2 3; do
              xcodebuild -downloadPlatform iOS -buildVersion "${VERSION//-/.}" && break
              test "$ATTEMPT" -lt 3 || { echo "Could not download the iOS $VERSION runtime"; exit 1; }
              sleep 30
            done
          fi
          UDID=$(xcrun simctl list devices available --json \
            | jq -r --arg runtime "$RUNTIME" --arg deviceType "$DEVICE_TYPE" \
              '.devices[$runtime][]? | select(.isAvailable and .deviceTypeIdentifier == $deviceType) | .udid' \
            | head -n 1)
          # Downloaded runtimes come without devices.
          test -n "$UDID" || UDID=$(xcrun simctl create "${{ matrix.device }}" "$DEVICE_TYPE" "$RUNTIME")
          xcrun simctl shutdown "$UDID" 2>/dev/null || true
          xcrun simctl erase "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
      - name: Run UI journeys
        id: journeys
        # A step timeout fails instead of cancelling, so the evidence below is still exported.
        timeout-minutes: 40
        env:
          SIM_UDID: ${{ steps.simulator.outputs.udid }}
          SIM_DISPLAY: ${{ matrix.display }}
          ARTIFACT_DIR: ${{ steps.evidence.outputs.directory }}
        run: scripts/run-ui-journeys.sh
      - name: Export evidence for Linux review
        id: export
        if: ${{ !cancelled() && steps.evidence.outputs.directory != '' }}
        env:
          ARTIFACT_DIR: ${{ steps.evidence.outputs.directory }}
        run: |
          if [ -d "$ARTIFACT_DIR/UI.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$ARTIFACT_DIR/UI.xcresult" \
              --output-path "$ARTIFACT_DIR/attachments"
            xcrun xcresulttool get test-results summary --path "$ARTIFACT_DIR/UI.xcresult" \
              > "$ARTIFACT_DIR/test-summary.json.tmp"
            mv "$ARTIFACT_DIR/test-summary.json.tmp" "$ARTIFACT_DIR/test-summary.json"
            xcrun xcresulttool get test-results tests --path "$ARTIFACT_DIR/UI.xcresult" \
              > "$ARTIFACT_DIR/tests.json"
          fi
      - name: Create portable evidence report
        if: ${{ !cancelled() && steps.evidence.outputs.directory != '' }}
        env:
          ARTIFACT_DIR: ${{ steps.evidence.outputs.directory }}
          JOURNEY_OUTCOME: ${{ steps.journeys.outcome }}
          EXPORT_OUTCOME: ${{ steps.export.outcome }}
        run: |
          jq --arg journeys "$JOURNEY_OUTCOME" --arg export "$EXPORT_OUTCOME" \
            '. + {journey_outcome: $journeys, export_outcome: $export}' \
            "$ARTIFACT_DIR/metadata.json" > "$ARTIFACT_DIR/metadata-next.json"
          mv "$ARTIFACT_DIR/metadata-next.json" "$ARTIFACT_DIR/metadata.json"
          python3 scripts/ui-evidence-report.py "$ARTIFACT_DIR"
      - name: Retain video, screenshots and test results
        id: upload
        if: ${{ !cancelled() && steps.evidence.outputs.directory != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-${{ matrix.device }}-${{ matrix.runtime }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.directory }}
          if-no-files-found: error
          retention-days: 14
      - name: Link evidence in job summary
        if: ${{ !cancelled() && steps.upload.outputs.artifact-url != '' }}
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEVICE: ${{ matrix.device }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          {
            echo "### Simulator evidence: $DEVICE / iOS $RUNTIME"
            echo
            echo "PR head: \`$HEAD_SHA\`"
            echo
            echo "[Download screenshots, video and test report]($ARTIFACT_URL)"
            echo
            echo 'Extract the artifact and open index.html. On Linux, run scripts/pr-evidence.sh PR_NUMBER.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Shut down test simulator
        if: ${{ !cancelled() && steps.simulator.outputs.udid != '' }}
        run: xcrun simctl shutdown "${{ steps.simulator.outputs.udid }}" 2>/dev/null || true
      - name: Remove temporary evidence
        if: ${{ !cancelled() && steps.evidence.outputs.directory != '' }}
        env:
          ARTIFACT_DIR: ${{ steps.evidence.outputs.directory }}
        run: rm -rf "$ARTIFACT_DIR"
