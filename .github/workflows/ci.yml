name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check changed files
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- . \
            ':(exclude)*.md' \
            ':(exclude)**/*.md'; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  secrets:
    name: Secret Patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check tracked files
        run: scripts/check-secrets.sh

  formatting:
    name: Swift Format
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Check formatting
        run: |
          xcodebuild -version
          xcrun swift-format --version
          scripts/check-formatting.sh

  lint:
    name: SwiftLint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Install SwiftLint
        run: |
          command -v swiftlint >/dev/null 2>&1 || brew install swiftlint
          swiftlint version

      - name: Run SwiftLint
        run: scripts/lint-swift.sh

  build-test:
    name: Build & Test
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project GrowingUp.xcodeproj \
            -scheme GrowingUp

      - name: Pick iOS Simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.isAvailable and (.name | startswith("iPhone")))] | .[0] // empty')
          test -n "$DEVICE" || { echo "No available iPhone simulator on runner"; exit 1; }
          UDID=$(jq -r '.udid' <<< "$DEVICE")
          echo "Using $(jq -r '.name' <<< "$DEVICE") ($UDID)"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build & Test
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          xcodebuild test \
            -project GrowingUp.xcodeproj \
            -scheme GrowingUp \
            -destination "id=$SIM_UDID"
