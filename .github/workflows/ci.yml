name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      run_duo_ui_tests:
        description: Run iPhone Duo UI journeys only when explicitly requested
        type: boolean
        default: false
      record_ui_video:
        description: Record UI video only when motion itself needs review
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Swift Format and SwiftLint run on Linux with the Swift version of Xcode 27.1 (.swift-version), so a pull
  # request takes only one macOS runner: Build & Test. Release Tools adds a second only when release inputs change.
  SWIFT_IMAGE: swift:6.4.0-noble@sha256:31d14d727f4451f25e29bac9c42563a098c39ac66415e8bad970f48038e38aca
  SWIFTLINT_VERSION: 0.65.1
  SWIFTLINT_LINUX_SHA256: caeed6f4a679c35539ffaf124f6c4ab4a8416917f7d8796279dc52b74026059d

jobs:
  release-tools:
    name: Release Tools
    # Pull requests run it only when fastlane, Gemfile, project, plist, entitlement or workflow files change;
    # master pushes and manual runs always do. A skipped job still satisfies the required check.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.release_required != 'false' }}
    runs-on: macos-26
    env:
      MATCH_GIT_URL: git@github.com:zigdanis/zigdanis-certificates.git
      FASTLANE_SKIP_UPDATE_CHECK: 'true'
      FASTLANE_SKIP_DOCS: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          # marketing/ holds ~800 MB of store media that no build or test reads.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/marketing/
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Check release state and fastlane configuration
        env:
          FL_REPORT_PATH: ${{ runner.temp }}
        run: |
          MT_NO_PLUGINS=1 ruby fastlane/tests/test_testflight_release.rb
          bundle exec ruby fastlane/tests/test_release_signing.rb
          bundle exec ruby fastlane/tests/test_release_archive.rb
          bundle exec ruby fastlane/tests/test_release_distribution.rb
          bundle exec ruby fastlane/tests/test_release_execution.rb
          bundle exec fastlane lanes
          bundle exec fastlane action match | ruby -e 'abort "Pinned match lacks safe expired-certificate renewal" unless STDIN.read.include?("renew_expired_certs")'

  evidence-tools:
    name: Evidence Tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Check evidence scripts
        run: |
          bash -n scripts/run-ui-journeys.sh
          bash -n scripts/pr-evidence.sh
          bash -n scripts/simulator-app.sh
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests

  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      ios_required: ${{ steps.filter.outputs.ios_required }}
      ui_required: ${{ steps.filter.outputs.ui_required }}
      release_required: ${{ steps.filter.outputs.release_required }}
      ui_matrix: ${{ steps.ui.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Check changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_DUO_UI_TESTS: ${{ inputs.run_duo_ui_tests }}
        run: |
          UI_ARGS=()
          if [ "$RUN_DUO_UI_TESTS" = true ]; then
            UI_ARGS+=(--run-duo-ui-tests)
          fi
          python3 scripts/ci-scope.py --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA" "${UI_ARGS[@]}" >> "$GITHUB_OUTPUT"

      # Developer-requested UI journeys use Xcode 27.1 / iOS 27.1.
      # That runtime currently supports only iPhone Duo, which boots folded. Journeys run
      # on its outer display ("primary"); simctl needs that display named for video.
      # iOS 18 remains supported by the app, but is not tested in CI.
      - name: Choose UI devices
        id: ui
        run: |
          MATRIX=$(jq -c '.' <<'JSON'
          [
            {"name": "iPhone Duo", "runner": "xcode-27", "xcode": "27.1", "runtime": "27-1",
             "device": "iPhone-Duo", "display": "primary"}
          ]
          JSON
          )
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  secrets:
    name: Secret Patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tracked files
        run: scripts/check-secrets.sh

  formatting:
    name: Swift Format
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ios_required != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/marketing/
            !/docs/

      - name: Check formatting
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" -w /src "$SWIFT_IMAGE" \
            sh -c 'swift --version && scripts/check-formatting.sh'

  lint:
    name: SwiftLint
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ios_required != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/marketing/
            !/docs/

      - name: Install pinned SwiftLint
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/swiftlint_linux_amd64.zip"
          echo "$SWIFTLINT_LINUX_SHA256  $RUNNER_TEMP/swiftlint.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/swiftlint.zip" swiftlint -d "$RUNNER_TEMP/swiftlint"

      # The dynamic build uses the toolchain's SourceKit, so rules such as statement_position still run.
      - name: Run SwiftLint
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" -w /src \
            -v "$RUNNER_TEMP/swiftlint:/opt/swiftlint:ro" \
            -e PATH=/opt/swiftlint:/usr/local/bin:/usr/bin:/bin \
            -e LINUX_SOURCEKIT_LIB_PATH=/usr/lib \
            "$SWIFT_IMAGE" sh -c 'swiftlint version && scripts/lint-swift.sh'

  build-test:
    name: Build & Test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ios_required != 'false' }}
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/marketing/

      - name: Select Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode_27.1.app
          xcodebuild -version

      # A cold simulator takes minutes to boot, so it boots while packages restore and the app builds.
      - name: Boot iOS Simulator in the background
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.isAvailable and (.name | startswith("iPhone")))] | .[0] // empty')
          test -n "$DEVICE" || { echo "No available iPhone simulator on runner"; exit 1; }
          UDID=$(jq -r '.udid' <<< "$DEVICE")
          echo "Using $(jq -r '.name' <<< "$DEVICE") ($UDID)"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          nohup xcrun simctl boot "$UDID" > "$RUNNER_TEMP/simulator-boot.log" 2>&1 &

      - uses: ./.github/actions/swift-packages

      # Xcode's content-addressed compilation cache survives a fresh checkout, unlike DerivedData timestamps.
      # Master pushes and manual runs save it; pull requests only restore it.
      - name: Restore compilation cache
        id: cas
        uses: actions/cache/restore@v6
        with:
          path: ~/DerivedData/CompilationCache.noindex
          key: xcode-cas-27.1-debug-${{ github.sha }}
          restore-keys: |
            xcode-cas-27.1-debug-

      - name: Build for testing
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          xcodebuild build-for-testing \
            -project GrowingUp.xcodeproj \
            -scheme GrowingUp \
            -destination "id=$SIM_UDID" \
            -derivedDataPath ~/DerivedData \
            -clonedSourcePackagesDirPath ~/SourcePackages \
            -disablePackageRepositoryCache \
            -disableAutomaticPackageResolution \
            -enableCodeCoverage NO \
            COMPILATION_CACHE_ENABLE_CACHING=YES
          du -sh ~/DerivedData/CompilationCache.noindex || true

      - name: Wait for simulator boot
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          SECONDS=0
          xcrun simctl bootstatus "$SIM_UDID" -b
          echo "Simulator ready after a further ${SECONDS}s"
          cat "$RUNNER_TEMP/simulator-boot.log"

      - name: Unit tests
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          xcodebuild test-without-building \
            -project GrowingUp.xcodeproj \
            -scheme GrowingUp \
            -only-testing:GrowingUpTests \
            -destination "id=$SIM_UDID" \
            -derivedDataPath ~/DerivedData \
            -clonedSourcePackagesDirPath ~/SourcePackages \
            -disablePackageRepositoryCache \
            -enableCodeCoverage NO \
            -collect-test-diagnostics never

      - name: Save compilation cache
        if: ${{ success() && github.event_name != 'pull_request' && steps.cas.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/DerivedData/CompilationCache.noindex
          key: xcode-cas-27.1-debug-${{ github.sha }}

  ui-tests:
    name: UI Tests — ${{ matrix.name }}
    # Opt-in only: automatic PR and master CI never start Duo UI journeys.
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.run_duo_ui_tests && needs.changes.outputs.ui_required == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.ui_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - name: Prepare evidence directory
        id: evidence
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEVICE: ${{ matrix.device }}
          RUNTIME: ${{ matrix.runtime }}
          XCODE: ${{ matrix.xcode }}
        run: |
          ARTIFACT_DIR=$(mktemp -d "$RUNNER_TEMP/ui-evidence.XXXXXX")
          echo "directory=$ARTIFACT_DIR" >> "$GITHUB_OUTPUT"
          jq -n --arg head "$HEAD_SHA" --arg checkout "$(git rev-parse HEAD)" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg device "$DEVICE" --arg runtime "$RUNTIME" --arg xcode "$XCODE" \
            '{head_sha: $head, checkout_sha: $checkout, run_id: $run, run_attempt: $attempt,
              device: $device, runtime: $runtime, xcode: $xcode}' \
            > "$ARTIFACT_DIR/metadata.json"
      - name: Select pinned Xcode
        run: |
          test -d "/Applications/Xcode_${{ matrix.xcode }}.app"
          sudo xcode-select -switch "/Applications/Xcode_${{ matrix.xcode }}.app"
          xcodebuild -version
      - name: Prepare simulator
        id: simulator
        run: |
          RUNTIME="com.apple.CoreSimulator.SimRuntime.iOS-${{ matrix.runtime }}"
          DEVICE_TYPE="com.apple.CoreSimulator.SimDeviceType.${{ matrix.device }}"
          if ! xcrun simctl list runtimes available --json \
            | jq -e --arg runtime "$RUNTIME" '.runtimes[] | select(.identifier == $runtime)' > /dev/null; then
            VERSION="${{ matrix.runtime }}"
            for ATTEMPT in 1 2 3; do
              xcodebuild -downloadPlatform iOS -buildVersion "${VERSION//-/.}" && break
              test "$ATTEMPT" -lt 3 || { echo "Could not download the iOS $VERSION runtime"; exit 1; }
              sleep 30
            done
          fi
          UDID=$(xcrun simctl list devices available --json \
            | jq -r --arg runtime "$RUNTIME" --arg deviceType "$DEVICE_TYPE" \
              '.devices[$runtime][]? | select(.isAvailable and .deviceTypeIdentifier == $deviceType) | .udid' \
            | head -n 1)
          # Downloaded runtimes come without devices.
          test -n "$UDID" || UDID=$(xcrun simctl create "${{ matrix.device }}" "$DEVICE_TYPE" "$RUNTIME")
          xcrun simctl shutdown "$UDID" 2>/dev/null || true
          xcrun simctl erase "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
      - name: Run UI journeys
        id: journeys
        # A step timeout fails instead of cancelling, so the evidence below is still exported.
        timeout-minutes: 40
        env:
          SIM_UDID: ${{ steps.simulator.outputs.udid }}
          SIM_DISPLAY: ${{ matrix.display }}
          ARTIFACT_DIR: ${{ steps.evidence.outputs.directory }}
          UI_RECORD_VIDEO: ${{ inputs.record_ui_video && '1' || '0' }}
        run: scripts/run-ui-journeys.sh
      - name: Export evidence for Linux review
        id: export
        if: ${{ !cancelled() && steps.evidence.outputs.directory != '' }}
        env:
          ARTIFACT_DIR: ${{ steps.evidence.outputs.directory }}
        run: |
          if [ -d "$ARTIFACT_DIR/UI.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$ARTIFACT_DIR/UI.xcresult" \
              --output-path "$ARTIFACT_DIR/attachments"
            xcrun xcresulttool get test-results summary --path "$ARTIFACT_DIR/UI.xcresult" \
              > "$ARTIFACT_DIR/test-summary.json.tmp"
            mv "$ARTIFACT_DIR/test-summary.json.tmp" "$ARTIFACT_DIR/test-summary.json"
            xcrun xcresulttool get test-results tests --path "$ARTIFACT_DIR/UI.xcresult" \
              > "$ARTIFACT_DIR/tests.json"
          fi
      - name: Create portable evidence report
        if: ${{ !cancelled() && steps.evidence.outputs.directory != '' }}
        env:
          ARTIFACT_DIR: ${{ steps.evidence.outputs.directory }}
          JOURNEY_OUTCOME: ${{ steps.journeys.outcome }}
          EXPORT_OUTCOME: ${{ steps.export.outcome }}
        run: |
          jq --arg journeys "$JOURNEY_OUTCOME" --arg export "$EXPORT_OUTCOME" \
            '. + {journey_outcome: $journeys, export_outcome: $export}' \
            "$ARTIFACT_DIR/metadata.json" > "$ARTIFACT_DIR/metadata-next.json"
          mv "$ARTIFACT_DIR/metadata-next.json" "$ARTIFACT_DIR/metadata.json"
          python3 scripts/ui-evidence-report.py "$ARTIFACT_DIR"
      - name: Retain video, screenshots and test results
        id: upload
        if: ${{ !cancelled() && steps.evidence.outputs.directory != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-${{ matrix.device }}-${{ matrix.runtime }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.directory }}
          if-no-files-found: error
          retention-days: 14
      - name: Link evidence in job summary
        if: ${{ !cancelled() && steps.upload.outputs.artifact-url != '' }}
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEVICE: ${{ matrix.device }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          {
            echo "### Simulator evidence: $DEVICE / iOS $RUNTIME"
            echo
            echo "PR head: \`$HEAD_SHA\`"
            echo
            echo "[Download screenshots, video and test report]($ARTIFACT_URL)"
            echo
            echo 'Extract the artifact and open index.html. On Linux, run scripts/pr-evidence.sh PR_NUMBER.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Shut down test simulator
        if: ${{ !cancelled() && steps.simulator.outputs.udid != '' }}
        run: xcrun simctl shutdown "${{ steps.simulator.outputs.udid }}" 2>/dev/null || true
      - name: Remove temporary evidence
        if: ${{ !cancelled() && steps.evidence.outputs.directory != '' }}
        env:
          ARTIFACT_DIR: ${{ steps.evidence.outputs.directory }}
        run: rm -rf "$ARTIFACT_DIR"
